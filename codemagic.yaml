workflows:
  # ===== ANDROID: genera un APK instalable para PROBAR que todo compila =====
  android:
    name: MisAutonomos Android
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22.14.0
    scripts:
      - name: Instalar dependencias
        script: npm install
      - name: Compilar la web
        script: npm run build
      - name: Capacitor sync Android
        script: npx cap sync android
      - name: Build APK (debug)
        script: |
          # Fijar Java 21 EN ESTE MISMO paso (no se hereda entre pasos)
          export JAVA_HOME=$(/usr/libexec/java_home -v 21 2>/dev/null || echo "$(brew --prefix openjdk@21)/libexec/openjdk.jdk/Contents/Home")
          echo "Compilando con:"; "$JAVA_HOME/bin/java" -version
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug -Dorg.gradle.java.home="$JAVA_HOME"
    artifacts:
      - android/app/build/outputs/**/*.apk

  # ===== ANDROID RELEASE (.aab para Play): actívalo cuando tengas el keystore =====
  android-release:
    name: MisAutonomos Android Release (.aab)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22.14.0
      groups:
        - keystore_credentials   # crea este grupo en Codemagic: CM_KEYSTORE, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
    scripts:
      - name: Instalar dependencias
        script: npm install
      - name: Compilar la web
        script: npm run build
      - name: Capacitor sync Android
        script: npx cap sync android
      - name: Preparar keystore
        script: echo $CM_KEYSTORE | base64 --decode > $CM_BUILD_DIR/android/app/release.keystore
      - name: Build AAB firmado
        script: |
          export JAVA_HOME=$(/usr/libexec/java_home -v 21 2>/dev/null || echo "$(brew --prefix openjdk@21)/libexec/openjdk.jdk/Contents/Home")
          echo "Compilando con:"; "$JAVA_HOME/bin/java" -version
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            -Pandroid.injected.signing.store.file=$CM_BUILD_DIR/android/app/release.keystore \
            -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD
    artifacts:
      - android/app/build/outputs/**/*.aab

  # ===== iOS: compila la app (sin firmar). El .ipa firmado vendra con tu cuenta Apple =====
  ios:
    name: MisAutonomos iOS (compilacion)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22.14.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependencias
        script: npm install
      - name: Compilar la web
        script: npm run build
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Instalar pods
        script: cd ios/App && pod install
      - name: Compilar (sin firma)
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -archivePath $CM_BUILD_DIR/build/App.xcarchive archive \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/*.xcarchive
