workflows:
  # ===== ANDROID: APK de prueba (no firmado para tiendas) =====
  android:
    name: MisAutonomos Android
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22.14.0
    scripts:
      - name: Instalar dependencias
        script: npm install
      - name: Compilar la web
        script: npm run build
      - name: Capacitor sync Android
        script: npx cap sync android
      - name: Build APK (debug)
        script: |
          export JAVA_HOME=$(/usr/libexec/java_home -v 21 2>/dev/null || echo "$(brew --prefix openjdk@21)/libexec/openjdk.jdk/Contents/Home")
          echo "Compilando con:"; "$JAVA_HOME/bin/java" -version
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug -Dorg.gradle.java.home="$JAVA_HOME"
    artifacts:
      - android/app/build/outputs/**/*.apk

  # ===== ANDROID RELEASE (.aab firmado para Google Play) =====
  android-release:
    name: MisAutonomos Android Release (.aab)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22.14.0
      groups:
        - keystore_credentials
    scripts:
      - name: Instalar dependencias
        script: npm install
      - name: Compilar la web
        script: npm run build
      - name: Capacitor sync Android
        script: npx cap sync android
      - name: Preparar keystore
        script: echo $CM_KEYSTORE | base64 --decode > $CM_BUILD_DIR/android/app/release.keystore
      - name: Build AAB firmado
        script: |
          export JAVA_HOME=$(/usr/libexec/java_home -v 21 2>/dev/null || echo "$(brew --prefix openjdk@21)/libexec/openjdk.jdk/Contents/Home")
          echo "Compilando con:"; "$JAVA_HOME/bin/java" -version
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            -Pandroid.injected.signing.store.file=$CM_BUILD_DIR/android/app/release.keystore \
            -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD
    artifacts:
      - android/app/build/outputs/**/*.aab

  # ===== iOS: .ipa firmado y subido a App Store Connect =====
  ios:
    name: MisAutonomos iOS (.ipa)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: codemagic_asc_api_key
    environment:
      node: 22.14.0
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.base690076ad86e673c796768de5.app
      vars:
        BUNDLE_ID: "com.base690076ad86e673c796768de5.app"
        APP_STORE_APPLE_ID: 6759524805
    scripts:
      - name: Instalar dependencias
        script: npm install
      - name: Compilar la web
        script: npm run build
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Instalar pods
        script: cd ios/App && pod install
      - name: Registrar dispositivos y perfiles de firma
        script: |
          xcode-project use-profiles
      - name: Build IPA firmado
        script: |
          cd ios/App
          xcode-project build-ipa \
            --workspace App.xcworkspace \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
